name: CI

on:
  push:
    branches: ['2.next-cake5', 'master']
  pull_request:

permissions:
  contents: read

# The OAuth tests resolve cakedc/oauth-server and cakedc/cakephp-oauth-server from path repositories
# (../oauth-server and ../cakephp-oauth-server), so every job checks them out next to this one, at a
# released tag so CI does not drift with their branches. Both repositories are public, so the workflow
# token is enough; a CAKEDC_PRIVATE_REPOS_TOKEN secret is used instead when the organisation defines one.
env:
  OAUTH_SERVER_REF: '1.0.0'
  OAUTH_PLUGIN_REF: '1.0.0'

jobs:
  testsuite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          - php-version: '8.2'
            dependencies: 'lowest'
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: cakephp-mcp
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CakeDC/oauth-server
          ref: ${{ env.OAUTH_SERVER_REF }}
          path: oauth-server
          token: ${{ secrets.CAKEDC_PRIVATE_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CakeDC/cakephp-oauth-server
          ref: ${{ env.OAUTH_PLUGIN_REF }}
          path: cakephp-oauth-server
          token: ${{ secrets.CAKEDC_PRIVATE_REPOS_TOKEN || github.token }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite, openssl
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: ${{ matrix.dependencies }}
          working-directory: cakephp-mcp
      - run: vendor/bin/phpunit
        working-directory: cakephp-mcp

  cs-stan:
    runs-on: ubuntu-24.04
    name: Coding standard and static analysis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: cakephp-mcp
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CakeDC/oauth-server
          ref: ${{ env.OAUTH_SERVER_REF }}
          path: oauth-server
          token: ${{ secrets.CAKEDC_PRIVATE_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CakeDC/cakephp-oauth-server
          ref: ${{ env.OAUTH_PLUGIN_REF }}
          path: cakephp-oauth-server
          token: ${{ secrets.CAKEDC_PRIVATE_REPOS_TOKEN || github.token }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          working-directory: cakephp-mcp
      - run: vendor/bin/phpcs
        working-directory: cakephp-mcp
      - run: vendor/bin/phpstan analyse --no-progress
        working-directory: cakephp-mcp

  conformance:
    runs-on: ubuntu-24.04
    name: MCP conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: cakephp-mcp
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CakeDC/oauth-server
          ref: ${{ env.OAUTH_SERVER_REF }}
          path: oauth-server
          token: ${{ secrets.CAKEDC_PRIVATE_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CakeDC/cakephp-oauth-server
          ref: ${{ env.OAUTH_PLUGIN_REF }}
          path: cakephp-oauth-server
          token: ${{ secrets.CAKEDC_PRIVATE_REPOS_TOKEN || github.token }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          working-directory: cakephp-mcp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: tests/Conformance/run.sh
        working-directory: cakephp-mcp
